# Name of the workflow displayed in the Actions tab
name: Dependencies-CICD
# Manual Click (delivery) workflow whenever user need
on:
  workflow_dispatch:

jobs:
  # Every jobs need seprate runner, its called parallelism 
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: echo "Code Clone from github"

  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build docker container
        run: echo "Docker Container Build"

  test:
    needs: [code, build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing The container"

  deploy:
    needs: [build, code, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app
        run: echo "Docker Compose Deployed the app"
