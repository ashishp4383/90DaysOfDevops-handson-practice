# Workflow name
name: Hello

# Runs on an automatic trigger when changes are pushed to main matching .html files
on:
  push:
    branches: [main]
    # Workflow runs when any .html file changes; otherwise it will not run.
    paths:
      - '**.html'

# Jobs inside the workflow
jobs:
  # Job ID
  greet:
    # GitHub-hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Say hello to everyone
        run: echo "Hello Everyone"

      - name: Say hello to username
        run: echo "Hello ${{ github.actor }}"

  details:
    runs-on: ubuntu-latest
    steps:
      - name: Show Docker and Python versions
        run: docker --version && python3 --version
