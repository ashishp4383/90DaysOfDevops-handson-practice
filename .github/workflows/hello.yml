# Workflow name
name: Hello

# Runs on an automatic Trigger, when ever change is to pushed to branch (deployment)
on:
  push:
    branches: [main]

# Jobs inside the workflow
jobs:
  # Job ID
  greet:
    # GitHub-hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Say hello to everyone
        run: echo "Hello Everyone"

      - name: Say hello to username
        run: echo "Hello ${{ github.actor }}"

  details:
    runs-on: ubuntu-latest
    steps:
      - name: Show Docker and Python versions
        run: docker --version && python --version
