# Workflow name
name: Hello

# Trigger when pushing to main
on:
  push:
    branches: [main]

# Jobs inside the workflow
jobs:
  # Job ID
  greet:
    # GitHub-hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Say hello to everyone
        run: echo "Hello Everyone"

      - name: Say hello to username
        run: echo "Hello ${{ github.actor }}"
