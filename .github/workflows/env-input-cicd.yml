# Name of the workflow displayed in the Actions tab
name: env-input-CICD

# Manual trigger whenever a user starts the workflow from Actions
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for this workflow run
        default: 'dev'
        required: true
        type: choice
        options:
          - dev
          - prod
          - staging

jobs:
  # Each job runs on its own runner instance
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: echo "Code Clone from github"

  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build docker container
        run: echo "Docker Container Build"

  test:
    needs: [code, build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing The container"

  deploy:
    if: inputs.environment == 'dev'
    needs: [build, code, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app
        run: echo "Deploying to ${{ inputs.environment }} using Docker Compose"
